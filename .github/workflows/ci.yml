name: App checks
on:
  pull_request:
  push:
    branches: [nimi]
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
      - run: corepack enable
      - run: python -m pip install uv==0.12.22
      - run: python -m uv sync --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nimi-app check
      - run: pnpm exec nimi-app test
