app_id: moneyprinterturbo.studio
display_name: MoneyPrinterTurbo
version: 0.1.0
profile: standalone
npm_package_name: moneyprinterturbo-nimi-app
cargo_package_name: moneyprinterturbo-nimi-app-shell
tauri_identifier: ai.nimi.apps.moneyprinterturbo.studio
package_author: nimiplatform
submission_role: developer-submitted-input
capability_contract_refs:
  - text.generate
  - text.embed
  - audio.synthesize
  - audio.transcribe
  - image.generate
  - video.generate
  - voice.create
  - music.generate
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
safety_profile:
  ai:
    direct_interaction: true
    interaction_notice: absent
    outputs:
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: text
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: image
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: exportable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: audio
        publication_control: not-applicable
      - export_visible_marking: absent
        exposure: publishable
        in_product_notice: absent
        machine_readable_marking: absent
        modality: video
        publication_control: user-confirmed
    risk_features:
      - realistic-voice-replication
    subject_notice: not-applicable
  content_descriptors: []
  data_practices:
    commercial_features: []
    publisher_direct_external_network: true
    sensitive_data_categories: []
    telemetry: []
    third_party_account: optional
    user_content_sharing: public
  high_impact_decision_uses: []
  intended_audience: general
support_manifest:
  diagnostics_bundle_fields:
    - app_version
    - runtime_status
    - task_id
    - stage
    - job_id
    - media_tools
  redaction_rules:
    - credentials
    - business_account_keys
    - user_media
  user_visible_issue_categories:
    - startup
    - runtime
    - media
    - stock-services
    - publication
  escalation_path: NIMI_APP.md#support
  kill_switch_visibility: visible
  recovery_instructions: Stop the task in the App. Restart it through Nimi. Inspect known Jobs and saved stage results, then explicitly continue; an uncertain submission without a Job ID must be checked before a new charged request.
review_inputs:
  manifest: nimi.app.yaml
  build_profile: .nimi/config/build-profile.yaml
  scaffold_boundary: .nimi/contracts/scaffold-boundary.yaml
admission_truth: platform-owned-after-review
