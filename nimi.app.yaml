app_id: moneyprinterturbo.studio
display_name: MoneyPrinterTurbo
version: 0.1.0
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
  - integration.provide
capability_contract_refs:
  - text.generate
  - text.embed
  - audio.synthesize
  - audio.transcribe
  - image.generate
  - video.generate
  - voice.create
  - music.generate
required_standardized_feature_refs: []
storage_policy:
  kind: nimi-mediated-default
metadata:
  summary: Create short videos with scripts, narration, aligned subtitles and local or stock footage.
  icon: assets/app-icon.png
  release_notes: RELEASE_NOTES.md
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1450
safety_profile:
  intended_audience: general
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features:
      - realistic-voice-replication
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: image
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: audio
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
      - modality: video
        exposure: publishable
        publication_control: user-confirmed
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: true
    telemetry: []
    third_party_account: optional
    user_content_sharing: public
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
