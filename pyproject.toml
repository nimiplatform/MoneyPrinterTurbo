[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
[project]
name = "moneyprinterturbo"
version = "1.3.7"
description = "Deterministic media worker for MoneyPrinterTurbo for Nimi"
readme = "NIMI_APP.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["moviepy==2.2.1", "loguru==0.7.3", "pydantic>=2.12,<3"]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.21"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.uv]
package = false
